name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build self-contained Windows installer
        run: >-
          dotnet publish windows/GachaCalculators/GachaCalculators.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o windows/artifacts/publish
      - uses: actions/upload-artifact@v4
        with:
          name: GachaCalculatorsSetup-win-x64
          path: windows/artifacts/publish/GachaCalculators.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag windows/artifacts/publish/GachaCalculators.exe --title "Gacha Calculators $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag windows/artifacts/publish/GachaCalculators.exe --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

name: Build Windows installer

# Bấm nút "Run workflow" trong tab Actions của repo để chạy — không tự chạy khi bạn
# chỉ sửa app web (calculators/), nên sửa app web xong không tốn công build lại app desktop.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Lấy code trong repo
        uses: actions/checkout@v4

      - name: Cài Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build file cài đặt Windows (.msi + .exe) và tạo bản nháp Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-app
          # tauri-action tự tạo một Release ở dạng nháp (draft), đặt tên theo
          # số phiên bản trong tauri.conf.json, và đính kèm 2 file cài đặt.
          # Vào tab Releases, mở bản nháp đó, bấm "Publish release" là xong.
